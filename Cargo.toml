[package]
name = "desktop-commander"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Remote desktop tools with an on-demand Flutter control panel"

[features]
default = []
tray = ["dep:tray-icon", "dep:tao"]

[dependencies]
anyhow = "1"
atomicwrites = "0.4"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
docx-rs = "0.4"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
jsonschema = { version = "0.33", default-features = false }
open = "5"
pdfium-render = { version = "=0.8.37", default-features = false, features = ["pdfium_7350", "thread_safe", "image"] }
plist = "1"
path-clean = "1"
quick-xml = "0.38"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
reqwest-websocket = "0.5.1"
rmcp = { version = "0.8", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
pulldown-cmark = "0.13"
pulldown-cmark-to-cmark = "21"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
umya-spreadsheet = "2.3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
tray-icon = { version = "0.21", optional = true }
tao = { version = "0.34", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

